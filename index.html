<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 防範搜尋引擎索引，避免被隨機搜尋到 -->
  <meta name="robots" content="noindex, nofollow">
  <title>1小時加密貨幣漲幅榜</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; color: #38bdf8; font-size: 20px; margin-bottom: 5px; }
    .update-time { text-align: center; color: #94a3b8; font-size: 12px; margin-bottom: 20px; }
    .card { background: #1e293b; border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .rank { font-weight: bold; width: 30px; color: #64748b; }
    .coin-info { flex: 1; display: flex; align-items: center; gap: 10px; }
    .symbol { font-weight: bold; text-transform: uppercase; }
    .price { color: #94a3b8; font-size: 14px; }
    .change { font-weight: bold; padding: 6px 10px; border-radius: 6px; }
    .up { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .down { background: rgba(239, 68, 68, 0.2); color: #f87171; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔥 1小時加密貨幣漲幅榜 (Top 20)</h1>
    <div class="update-time" id="time">載入資料中...</div>
    <div id="crypto-list">正在向 API 獲取最新行情...</div>
  </div>

  <script>
    async function fetchTopGainers() {
      try {
        // 呼叫 CoinGecko 免費 API 抓取市值前 100 幣種
        const res = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&sparkline=false&price_change_percentage=1h');
        const data = await res.json();
        
        // 依照 1小時漲幅排序 (降序)
        data.sort((a, b) => (b.price_change_percentage_1h_in_currency || -999) - (a.price_change_percentage_1h_in_currency || -999));
        
        // 取前 20 名
        const top20 = data.slice(0, 20);
        
        const listEl = document.getElementById('crypto-list');
        listEl.innerHTML = '';
        
        top20.forEach((coin, index) => {
          const change = coin.price_change_percentage_1h_in_currency ? coin.price_change_percentage_1h_in_currency.toFixed(2) : 0;
          const isUp = change >= 0;
          
          listEl.innerHTML += `
            <div class="card">
              <span class="rank">${index + 1}</span>
              <div class="coin-info">
                <div>
                  <div class="symbol">${coin.symbol} <span style="font-size:12px;color:#64748b;">${coin.name}</span></div>
                  <div class="price">$${coin.current_price.toLocaleString()}</div>
                </div>
              </div>
              <div class="change ${isUp ? 'up' : 'down'}">
                ${isUp ? '+' : ''}${change}%
              </div>
            </div>
          `;
        });
        
        document.getElementById('time').innerText = '最後更新時間：' + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById('crypto-list').innerText = '數據抓取失敗，可能是 API 請求過於頻繁，請稍後重試。';
      }
    }

    // 頁面打開時執行一次
    fetchTopGainers();
    // 每 2 分鐘自動重新抓取並更新一次
    setInterval(fetchTopGainers, 120000);
  </script>
</body>
</html>
