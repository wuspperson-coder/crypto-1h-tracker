<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>幣安 1小時 K線動態榜</title>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; color: #f0b90b; font-size: 20px; margin-bottom: 5px; }
    .update-time { text-align: center; color: #94a3b8; font-size: 12px; margin-bottom: 15px; }
    
    .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: #334155; color: #94a3b8; transition: 0.2s; }
    .tab-btn.active-up { background: #22c55e; color: #fff; }
    .tab-btn.active-down { background: #ef4444; color: #fff; }

    .card { background: #1e293b; border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; cursor: pointer; transition: background 0.2s; }
    .card:hover { background: #334155; }
    .card-header { display: flex; justify-content: space-between; align-items: center; }
    .rank { font-weight: bold; width: 30px; color: #64748b; }
    .coin-info { flex: 1; display: flex; align-items: center; gap: 10px; }
    .symbol { font-weight: bold; text-transform: uppercase; }
    .price { color: #94a3b8; font-size: 14px; }
    .change { font-weight: bold; padding: 6px 10px; border-radius: 6px; }
    .up { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .down { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    .chart-box { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid #334155; }
    .timeframe-btns { display: flex; gap: 6px; margin-bottom: 8px; }
    .tf-btn { padding: 4px 8px; border: 1px solid #475569; background: transparent; color: #94a3b8; border-radius: 4px; font-size: 12px; cursor: pointer; }
    .tf-btn.active { background: #f0b90b; color: #000; border-color: #f0b90b; font-weight: bold; }
    .kline-container { height: 180px; width: 100%; display: flex; align-items: center; justify-content: center; color: #64748b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>💛 幣安 1小時 K線動態榜</h1>
    <div class="update-time" id="time">載入幣安數據中...</div>
    
    <div class="tabs">
      <button class="tab-btn active-up" id="btn-up" onclick="switchMode('up')">🚀 1h 漲幅榜</button>
      <button class="tab-btn" id="btn-down" onclick="switchMode('down')">📉 1h 跌幅榜</button>
    </div>

    <div id="crypto-list">正在向幣安 API 獲取行情...</div>
  </div>

  <script>
    let rawList = [];
    let currentMode = 'up';

    async function fetchBinanceData() {
      try {
        const res = await fetch('https://api.binance.com/api/v3/ticker/24hr');
        const data = await res.json();
        
        const usdtPairs = data.filter(d => 
          d.symbol.endsWith('USDT') && 
          !d.symbol.includes('UPUSDT') && 
          !d.symbol.includes('DOWNUSDT') &&
          parseFloat(d.quoteVolume) > 1000000
        );

        const candidate = usdtPairs.sort((a,b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume)).slice(0, 50);

        const calculated = await Promise.all(candidate.map(async (coin) => {
          try {
            const kRes = await fetch(`https://api.binance.com/api/v3/klines?symbol=${coin.symbol}&interval=1h&limit=2`);
            const kData = await kRes.json();
            if (kData.length >= 2) {
              const open1h = parseFloat(kData[0][1]);
              const currentPrice = parseFloat(coin.lastPrice);
              const change1h = ((currentPrice - open1h) / open1h) * 100;
              return { ...coin, change1h };
            }
          } catch(e) {}
          return { ...coin, change1h: parseFloat(coin.priceChangePercent) };
        }));

        rawList = calculated.filter(c => c && !isNaN(c.change1h));
        renderList();
        document.getElementById('time').innerText = '最後更新時間：' + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById('crypto-list').innerText = '數據抓取失敗，請稍後重試。';
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('btn-up').className = 'tab-btn ' + (mode === 'up' ? 'active-up' : '');
      document.getElementById('btn-down').className = 'tab-btn ' + (mode === 'down' ? 'active-down' : '');
      renderList();
    }

    function renderList() {
      if (!rawList.length) return;

      const sorted = [...rawList].sort((a, b) => 
        currentMode === 'up' ? b.change1h - a.change1h : a.change1h - b.change1h
      );

      const top20 = sorted.slice(0, 20);
      const listEl = document.getElementById('crypto-list');
      listEl.innerHTML = '';

      top20.forEach((coin, index) => {
        const symbolClean = coin.symbol.replace('USDT', '');
        const change = coin.change1h.toFixed(2);
        const isUp = coin.change1h >= 0;
        const price = parseFloat(coin.lastPrice).toLocaleString();

        listEl.innerHTML += `
          <div class="card" onclick="toggleCard('${coin.symbol}')">
            <div class="card-header">
              <span class="rank">${index + 1}</span>
              <div class="coin-info">
                <div>
                  <div class="symbol">${symbolClean} <span style="font-size:12px;color:#64748b;">/USDT</span></div>
                  <div class="price">$${price}</div>
                </div>
              </div>
              <div class="change ${isUp ? 'up' : 'down'}">
                ${isUp ? '+' : ''}${change}%
              </div>
            </div>
            
            <div class="chart-box" id="box-${coin.symbol}">
              <div class="timeframe-btns" onclick="event.stopPropagation()">
                <button class="tf-btn active" onclick="loadKLine('${coin.symbol}', '15m', this)">15M</button>
                <button class="tf-btn" onclick="loadKLine('${coin.symbol}', '1h', this)">1H</button>
                <button class="tf-btn" onclick="loadKLine('${coin.symbol}', '4h', this)">4H</button>
                <button class="tf-btn" onclick="loadKLine('${coin.symbol}', '1d', this)">1D</button>
              </div>
              <div class="kline-container" id="kline-${coin.symbol}">圖表載入中...</div>
            </div>
          </div>
        `;
      });
    }

    function toggleCard(symbol) {
      const box = document.getElementById(`box-${symbol}`);
      const isHidden = box.style.display === '' || box.style.display === 'none';
      
      document.querySelectorAll('.chart-box').forEach(el => el.style.display = 'none');

      if (isHidden) {
        box.style.display = 'block';
        const defaultBtn = box.querySelector('.tf-btn');
        setTimeout(() => {
          loadKLine(symbol, '15m', defaultBtn);
        }, 50);
      }
    }

    async function loadKLine(symbol, interval, btnEl) {
      if(btnEl) {
        const parent = btnEl.parentElement;
        parent.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
        btnEl.classList.add('active');
      }

      const container = document.getElementById(`kline-${symbol}`);
      container.innerHTML = ''; // 清除「載入中」文字

      const chartWidth = container.clientWidth || (window.innerWidth - 80);

      // 修正背景設定 (防止 v4 版本報錯)
      const chart = LightweightCharts.createChart(container, {
        width: chartWidth,
        height: 180,
        layout: { 
          background: { type: 'solid', color: '#1e293b' }, // 設為卡片底色
          textColor: '#94a3b8' 
        },
        grid: { vertLines: { color: '#334155' }, horzLines: { color: '#334155' } },
        timeScale: { timeVisible: true, secondsVisible: false }
      });

      const candleSeries = chart.addCandlestickSeries({
        upColor: '#22c55e',
        downColor: '#ef4444',
        borderVisible: false,
        wickUpColor: '#22c55e',
        wickDownColor: '#ef4444',
      });

      try {
        const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=50`);
        const kData = await res.json();
        
        let formattedCandles = kData.map(k => ({
          time: Math.floor(k[0] / 1000), // 轉換為 UNIX 秒數
          open: parseFloat(k[1]),
          high: parseFloat(k[2]),
          low: parseFloat(k[3]),
          close: parseFloat(k[4]),
        }));

        // 過濾重複的時間點 (解決 API 偶發的資料重疊導致崩潰)
        const uniqueData = [];
        const seen = new Set();
        for (let item of formattedCandles) {
          if (!seen.has(item.time)) {
            seen.add(item.time);
            uniqueData.push(item);
          }
        }
        
        // 確保時間順序由舊到新
        uniqueData.sort((a, b) => a.time - b.time);

        candleSeries.setData(uniqueData);
        chart.timeScale().fitContent();
      } catch(err) {
        container.innerHTML = '<div style="color:#f87171;">無法載入 K 線圖數據</div>';
      }
    }

    fetchBinanceData();
    setInterval(fetchBinanceData, 60000);
  </script>
</body>
</html>
