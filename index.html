<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>幣安雙週期全自動策略模擬交易引擎 (Firebase 雲端實時同步)</title>
  
  <!-- 1. 引入 TradingView 工具與 Chart.js -->
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- 2. 引入 Google Firebase 實時資料庫 SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0e14; color: #eaecef; margin: 0; padding: 0; display: flex; min-height: 100vh; }
    
    .sidebar { width: 220px; background: #141821; border-right: 1px solid #2b313a; padding: 20px 15px; flex-shrink: 0; display: flex; flex-direction: column; }
    .sidebar-title { color: #f0b90b; font-size: 16px; font-weight: bold; margin-bottom: 20px; }
    .sidebar-menu { list-style: none; padding: 0; margin: 0; }
    .sidebar-item { padding: 10px 12px; border-radius: 6px; color: #848e9c; font-size: 14px; font-weight: 500; margin-bottom: 6px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
    .sidebar-item.active, .sidebar-item:hover { background: #1e2329; color: #f0b90b; }

    .main-content { flex: 1; padding: 20px; max-width: 1400px; margin: 0 auto; width: 100%; }
    
    .btc-signal-bar { background: #141821; border: 1px solid #2b313a; border-radius: 12px; padding: 12px 18px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .btc-title { font-size: 15px; font-weight: bold; color: #f0b90b; }
    .btc-lights-group { display: flex; gap: 12px; }
    .btc-light-item { background: #1e2329; border: 1px solid #2b313a; border-radius: 8px; padding: 6px 14px; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: bold; }
    .light-dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-green { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
    .dot-red { background: #ef4444; box-shadow: 0 0 10px #ef4444; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    h1 { font-size: 22px; color: #f0b90b; margin: 0; }

    .sync-status { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px; border-radius: 20px; background: rgba(34, 197, 94, 0.15); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.3); }

    /* 策略模式切換按紐 */
    .strategy-toggle-bar { display: flex; gap: 10px; margin-bottom: 15px; }
    .strat-btn { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #2b313a; background: #141821; color: #848e9c; font-weight: bold; cursor: pointer; text-align: center; }
    .strat-btn.active-a { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border-color: #38bdf8; }
    .strat-btn.active-b { background: rgba(240, 185, 11, 0.2); color: #f0b90b; border-color: #f0b90b; }

    /* 資料紀錄與導出工具列 */
    .data-tools-bar { display: flex; gap: 10px; margin-bottom: 15px; background: #141821; padding: 10px; border-radius: 8px; border: 1px solid #2b313a; align-items: center; flex-wrap: wrap; }
    .tool-btn { background: #1e2329; border: 1px solid #2b313a; color: #eaecef; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; }
    .tool-btn:hover { background: #2b313a; color: #f0b90b; }

    .card { background: #1e2329; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid #2b313a; }
    .card-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .symbol { font-size: 16px; font-weight: bold; }
    .badges { display: flex; gap: 6px; margin-top: 6px; }
    .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .badge-pump { background: rgba(14, 203, 129, 0.2); color: #0ecb81; border: 1px solid #0ecb81; }

    .charts-wrapper { margin-top: 14px; display: none; border-top: 1px solid #2b313a; padding-top: 12px; }
    .tv-chart-container { height: 380px; border-radius: 8px; overflow: hidden; margin-bottom: 12px; background: #141821; }

    .position-box-panel { background: #141821; border: 1px solid #2b313a; border-radius: 8px; padding: 12px; margin-bottom: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; text-align: center; }
    .position-item { padding: 6px; border-radius: 6px; }
    .pos-entry { background: rgba(250, 204, 21, 0.1); border: 1px solid rgba(250, 204, 21, 0.3); }
    .pos-tp { background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); }
    .pos-sl { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); }
    .pos-trail { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); }
    .pos-label { font-size: 10px; color: #848e9c; margin-bottom: 2px; }
    .pos-val { font-weight: bold; font-size: 12px; }

    .paper-stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 15px; }
    .stat-card { background: #1e2329; border: 1px solid #2b313a; border-radius: 10px; padding: 12px; text-align: center; }
    .stat-title { font-size: 11px; color: #848e9c; }
    .stat-value { font-size: 18px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="sidebar-title">⚡ 動能量化雷達</div>
    <ul class="sidebar-menu">
      <li class="sidebar-item active">
        <span>🤖</span><span>全自動策略模擬引擎</span>
      </li>
    </ul>
  </div>

  <div class="main-content">
    
    <!-- 🚦 BTC 大盤紅綠燈 -->
    <div class="btc-signal-bar">
      <div class="btc-title">🚦 BTC 大盤趨勢紅綠燈 <span id="btc-price" style="font-size:12px;color:#848e9c;">$00,000</span></div>
      <div class="btc-lights-group">
        <div class="btc-light-item"><span>15M</span><span class="light-dot dot-red" id="btc-light-15m"></span></div>
        <div class="btc-light-item"><span>1H</span><span class="light-dot dot-red" id="btc-light-1h"></span></div>
        <div class="btc-light-item"><span>4H</span><span class="light-dot dot-red" id="btc-light-4h"></span></div>
        <div class="btc-light-item"><span>1D</span><span class="light-dot dot-red" id="btc-light-1d"></span></div>
      </div>
    </div>

    <div class="header">
      <div>
        <h1>🤖 全自動動能突破策略引擎</h1>
        <div style="font-size:12px;color:#848e9c;" id="time">更新中...</div>
      </div>
      <div class="sync-status">
        <span class="light-dot dot-green"></span>
        <span>Firebase 雲端實時同步中</span>
      </div>
    </div>

    <!-- 雙策略引擎切換按鈕 -->
    <div class="strategy-toggle-bar">
      <button class="strat-btn active-a" id="btn-strat-a" onclick="switchStrategyEngine('A')">⚡ 策略 A：短線爆發型 (1H執行 / 4H趨勢)</button>
      <button class="strat-btn" id="btn-strat-b" onclick="switchStrategyEngine('B')">🐢 策略 B：中線波段型 (4H執行 / 1D趨勢)</button>
    </div>

    <!-- 資料紀錄與導出工具列 -->
    <div class="data-tools-bar">
      <span style="font-size:12px;font-weight:bold;color:#f0b90b;">💾 雲端備份與匯出：</span>
      <button class="tool-btn" onclick="exportTradesCSV()">📊 下載 Excel 複盤分析檔 (CSV)</button>
      <button class="tool-btn" style="color:#ef4444;" onclick="clearPaperTrades()">🗑️ 清空所有雲端紀錄</button>
    </div>

    <!-- 統計面板 -->
    <div class="paper-stats-grid">
      <div class="stat-card"><div class="stat-title">已開單總數</div><div class="stat-value" id="stat-total">0</div></div>
      <div class="stat-card"><div class="stat-title">策略勝率</div><div class="stat-value" id="stat-winrate" style="color:#22c55e;">0%</div></div>
      <div class="stat-card"><div class="stat-title">平均風報比 (R:R)</div><div class="stat-value" style="color:#f0b90b;">1 : 2.0+</div></div>
      <div class="stat-card"><div class="stat-title">模擬累積收益</div><div class="stat-value" id="stat-pnl" style="color:#38bdf8;">+0.0%</div></div>
    </div>

    <div id="paper-trades-list">系統即時監控市場中，符合策略條件時將自動在此建立模擬單...</div>

  </div>

  <script>
    // 3. 填入專屬 Firebase 設定金鑰
    const firebaseConfig = {
      apiKey: "AIzaSyBvvJrZqe-Zs5G83j7LsQISacIzLLJjxRU",
      authDomain: "my-crypto-radar.firebaseapp.com",
      databaseURL: "https://my-crypto-radar-default-rtdb.firebaseio.com",
      projectId: "my-crypto-radar",
      storageBucket: "my-crypto-radar.firebasestorage.app",
      messagingSenderId: "855010216604",
      appId: "1:855010216604:web:a7976f9c0ffa7f3149bb59",
      measurementId: "G-NW4QL1CW6L"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const tradesRef = db.ref('paper_trades');

    let activeEngine = 'A'; // 'A' 或 'B'
    let paperTrades = [];

    // 監聽 Firebase 雲端資料庫（毫秒級實時同步）
    tradesRef.on('value', (snapshot) => {
      const data = snapshot.val();
      paperTrades = data ? Object.values(data) : [];
      renderPaperTrades();
    });

    function switchStrategyEngine(engine) {
      activeEngine = engine;
      document.getElementById('btn-strat-a').className = engine === 'A' ? 'strat-btn active-a' : 'strat-btn';
      document.getElementById('btn-strat-b').className = engine === 'B' ? 'strat-btn active-b' : 'strat-btn';
      renderPaperTrades();
    }

    function calcEMA(prices, period) {
      if (prices.length < period) return prices[prices.length - 1];
      const k = 2 / (period + 1);
      let ema = prices.slice(0, period).reduce((a, b) => a + b, 0) / period;
      for (let i = period; i < prices.length; i++) ema = prices[i] * k + ema * (1 - k);
      return ema;
    }

    function calcATR(klines, period = 14) {
      let trs = [];
      for (let i = 1; i < klines.length; i++) {
        const h = parseFloat(klines[i][2]), l = parseFloat(klines[i][3]), pc = parseFloat(klines[i-1][4]);
        trs.push(Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc)));
      }
      return trs.slice(-period).reduce((a, b) => a + b, 0) / period;
    }

    /* 🚦 BTC 大盤紅綠燈 */
    async function fetchBTCSignals() {
      try {
        const tfs = [{tf:'15m',id:'btc-light-15m'}, {tf:'1h',id:'btc-light-1h'}, {tf:'4h',id:'btc-light-4h'}, {tf:'1d',id:'btc-light-1d'}];
        for (let item of tfs) {
          const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${item.tf}&limit=60`);
          const klines = await res.json();
          const closes = klines.map(k => parseFloat(k[4]));
          const price = closes[closes.length - 1];
          if (item.tf === '1h') document.getElementById('btc-price').innerText = `$${price.toLocaleString()}`;

          const isBull = price > calcEMA(closes, 10) && calcEMA(closes, 10) > calcEMA(closes, 21) && calcEMA(closes, 21) > calcEMA(closes, 50);
          document.getElementById(item.id).className = isBull ? 'light-dot dot-green' : 'light-dot dot-red';
        }
      } catch(e){}
    }

    /* 🤖 全自動雙策略引擎核心運算 */
    async function runAutoEngine() {
      fetchBTCSignals();
      try {
        const res = await fetch('https://api.binance.com/api/v3/ticker/24hr');
        const data = await res.json();
        let usdtPairs = data.filter(d => d.symbol.endsWith('USDT') && !d.symbol.includes('UP') && !d.symbol.includes('DOWN'))
                            .sort((a,b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume)).slice(0, 50);

        for (let coin of usdtPairs) {
          const [k1hRes, k4hRes, k1dRes] = await Promise.all([
            fetch(`https://api.binance.com/api/v3/klines?symbol=${coin.symbol}&interval=1h&limit=60`),
            fetch(`https://api.binance.com/api/v3/klines?symbol=${coin.symbol}&interval=4h&limit=60`),
            fetch(`https://api.binance.com/api/v3/klines?symbol=${coin.symbol}&interval=1d&limit=60`)
          ]);

          const k1h = await k1hRes.json();
          const k4h = await k4hRes.json();
          const k1d = await k1dRes.json();

          const price = parseFloat(coin.lastPrice);

          // 判斷策略 A（1H執行 / 4H趨勢）
          const c4h = k4h.map(k => parseFloat(k[4]));
          const is4hBull = price > calcEMA(c4h, 10) && calcEMA(c4h, 10) > calcEMA(c4h, 21);
          
          const lastGreen1h = k1h[k1h.length - 2];
          const open1h = parseFloat(lastGreen1h[1]), close1h = parseFloat(lastGreen1h[4]), low1h = parseFloat(lastGreen1h[3]);
          const isBigGreen1h = ((close1h - open1h) / open1h) >= 0.018;

          if (is4hBull && isBigGreen1h) {
            checkAndTriggerTrade(coin.symbol, 'A', price, open1h, close1h, low1h);
          }

          // 判斷策略 B（4H執行 / 1D趨勢）
          const c1d = k1d.map(k => parseFloat(k[4]));
          const is1dBull = price > calcEMA(c1d, 10) && calcEMA(c1d, 10) > calcEMA(c1d, 21);

          const lastGreen4h = k4h[k4h.length - 2];
          const open4h = parseFloat(lastGreen4h[1]), close4h = parseFloat(lastGreen4h[4]), low4h = parseFloat(lastGreen4h[3]);
          const isBigGreen4h = ((close4h - open4h) / open4h) >= 0.03;

          if (is1dBull && isBigGreen4h) {
            checkAndTriggerTrade(coin.symbol, 'B', price, open4h, close4h, low4h);
          }
        }

        updateOpenTradesStatus(usdtPairs);
        document.getElementById('time').innerText = '最後掃描：' + new Date().toLocaleTimeString();
      } catch(e){ console.error(e); }
    }

    function checkAndTriggerTrade(symbol, engineType, currentPrice, kOpen, kClose, kLow) {
      const hasOpen = paperTrades.some(t => t.symbol === symbol && t.engineType === engineType && t.status === 'OPEN');
      if (hasOpen) return;

      const entryPrice = (kOpen + kClose) / 2;
      const slPrice = kLow;
      const riskDistance = entryPrice - slPrice;

      if (riskDistance <= 0) return;

      const tp1Price = entryPrice + (riskDistance * 2.0);
      const tradeId = 'trade_' + Date.now() + '_' + Math.floor(Math.random()*1000);

      const newTrade = {
        id: tradeId,
        engineType,
        symbol,
        entryPrice,
        slPrice,
        tp1Price,
        trailStopPrice: slPrice,
        isHalfClosed: false,
        status: 'OPEN',
        entryTime: new Date().toLocaleString(),
        pnlPct: 0
      };

      // 直接寫入 Firebase 雲端資料庫
      tradesRef.child(tradeId).set(newTrade);
    }

    function updateOpenTradesStatus(marketTickers) {
      paperTrades.forEach(t => {
        if (t.status === 'OPEN') {
          const coin = marketTickers.find(c => c.symbol === t.symbol);
          if (coin) {
            const currentP = parseFloat(coin.lastPrice);
            let needsUpdate = false;

            if (!t.isHalfClosed && currentP >= t.tp1Price) {
              t.isHalfClosed = true;
              t.trailStopPrice = t.entryPrice;
              t.pnlPct += 2.0;
              needsUpdate = true;
            }

            if (currentP <= t.trailStopPrice) {
              t.status = t.isHalfClosed ? 'WIN' : 'LOSS';
              t.pnlPct = t.isHalfClosed ? 1.0 : -1.0;
              needsUpdate = true;
            }

            if (needsUpdate) {
              tradesRef.child(t.id).update(t);
            }
          }
        }
      });
    }

    function renderPaperTrades() {
      const container = document.getElementById('paper-trades-list');
      container.innerHTML = '';

      const filtered = paperTrades.filter(t => t.engineType === activeEngine);

      let total = filtered.length;
      let wins = filtered.filter(t => t.status === 'WIN').length;
      let closed = filtered.filter(t => t.status !== 'OPEN').length;
      let winrate = closed > 0 ? ((wins/closed)*100).toFixed(1) : 0;
      let totalPnl = filtered.reduce((acc, curr) => acc + curr.pnlPct, 0).toFixed(1);

      document.getElementById('stat-total').innerText = total;
      document.getElementById('stat-winrate').innerText = winrate + '%';
      document.getElementById('stat-pnl').innerText = (totalPnl >= 0 ? '+' : '') + totalPnl + '%';

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center;padding:40px;color:#848e9c;background:#1e2329;border-radius:12px;">策略 ${activeEngine} 目前無監控中的模擬單，等待市場出現大綠 K 突破...</div>`;
        return;
      }

      filtered.forEach(t => {
        let badge = '<span class="badge" style="background:#38bdf8;color:#000;">持倉監控中 OPEN</span>';
        if (t.isHalfClosed) badge = '<span class="badge badge-pump">✅ 已鎖定 2x SL 保本中</span>';
        if (t.status === 'WIN') badge = '<span class="badge badge-pump">🎯 獲利結算 WIN</span>';
        if (t.status === 'LOSS') badge = '<span class="badge" style="background:#ef4444;color:#fff;">🚨 止損出場 LOSS</span>';

        container.innerHTML += `
          <div class="card">
            <div class="card-header" onclick="toggleTradeCharts('${t.id}', '${t.symbol}')">
              <div>
                <div class="symbol">${t.symbol} <span style="font-size:12px;color:#848e9c;">[策略 ${t.engineType}]</span></div>
                <div class="badges">${badge} <span style="font-size:10px;color:#848e9c;">時間: ${t.entryTime}</span></div>
              </div>
              <div style="font-weight:bold;font-size:16px;color:${t.pnlPct >= 0 ? '#22c55e':'#ef4444'};">
                ${t.pnlPct >= 0 ? '+':''}${t.pnlPct.toFixed(1)} R
              </div>
            </div>

            <div class="charts-wrapper" id="trade-wrapper-${t.id}">
              <div class="position-box-panel">
                <div class="position-item pos-entry"><div class="pos-label">🟡 50% 大綠K進場價</div><div class="pos-val" style="color:#facc15;">$${t.entryPrice.toFixed(4)}</div></div>
                <div class="position-item pos-sl"><div class="pos-label">🔴 起漲點 SL</div><div class="pos-val" style="color:#ef4444;">$${t.slPrice.toFixed(4)}</div></div>
                <div class="position-item pos-tp"><div class="pos-label">🟢 1TP (2x SL 賣50%)</div><div class="pos-val" style="color:#22c55e;">$${t.tp1Price.toFixed(4)}</div></div>
                <div class="position-item pos-trail"><div class="pos-label">🛡️ 當前保本/移動SL</div><div class="pos-val" style="color:#38bdf8;">$${t.trailStopPrice.toFixed(4)}</div></div>
              </div>

              <div class="tv-chart-container" id="tv-box-${t.id}"></div>
            </div>
          </div>
        `;
      });
    }

    function toggleTradeCharts(tradeId, symbol) {
      const wrapper = document.getElementById(`trade-wrapper-${tradeId}`);
      if (wrapper.style.display === 'block') { wrapper.style.display = 'none'; return; }
      wrapper.style.display = 'block';

      const container = document.getElementById(`tv-box-${tradeId}`);
      container.innerHTML = '';
      setTimeout(() => {
        new TradingView.widget({
          "autosize": true, "symbol": `BINANCE:${symbol}`, "interval": activeEngine === 'A' ? "60" : "240",
          "timezone": "Asia/Taipei", "theme": "dark", "style": "1", "container_id": `tv-box-${tradeId}`
        });
      }, 50);
    }

    function exportTradesCSV() {
      let csvContent = "data:text/csv;charset=utf-8,\uFEFFID,策略類型,代幣,進場價,起漲點止損價,2xSL止盈價,狀態,盈虧R值,開單時間\n";
      paperTrades.forEach(t => {
        csvContent += `${t.id},策略${t.engineType},${t.symbol},${t.entryPrice},${t.slPrice},${t.tp1Price},${t.status},${t.pnlPct},${t.entryTime}\n`;
      });
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Firebase_Trades_Report_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    function clearPaperTrades() {
      if (confirm('確定要清空 Firebase 雲端上的所有模擬交易紀錄嗎？（兩台電腦都會同步清空）')) {
        tradesRef.remove();
      }
    }

    runAutoEngine();
    setInterval(runAutoEngine, 120000);
  </script>
</body>
</html>
