<script>
    let rawList = [];
    let currentMode = 'up';

    async function fetchBinanceData() {
      try {
        const res = await fetch('https://api.binance.com/api/v3/ticker/24hr');
        const data = await res.json();
        
        const usdtPairs = data.filter(d => 
          d.symbol.endsWith('USDT') && 
          !d.symbol.includes('UPUSDT') && 
          !d.symbol.includes('DOWNUSDT') &&
          parseFloat(d.quoteVolume) > 1000000
        );

        const candidate = usdtPairs.sort((a,b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume)).slice(0, 50);

        const calculated = await Promise.all(candidate.map(async (coin) => {
          try {
            const kRes = await fetch(`https://api.binance.com/api/v3/klines?symbol=${coin.symbol}&interval=1h&limit=2`);
            const kData = await kRes.json();
            if (kData.length >= 2) {
              const open1h = parseFloat(kData[0][1]);
              const currentPrice = parseFloat(coin.lastPrice);
              const change1h = ((currentPrice - open1h) / open1h) * 100;
              return { ...coin, change1h };
            }
          } catch(e) {}
          return { ...coin, change1h: parseFloat(coin.priceChangePercent) };
        }));

        rawList = calculated.filter(c => c && !isNaN(c.change1h));
        renderList();
        document.getElementById('time').innerText = '最後更新時間：' + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById('crypto-list').innerText = '數據抓取失敗，請稍後重試。';
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('btn-up').className = 'tab-btn ' + (mode === 'up' ? 'active-up' : '');
      document.getElementById('btn-down').className = 'tab-btn ' + (mode === 'down' ? 'active-down' : '');
      renderList();
    }

    function renderList() {
      if (!rawList.length) return;

      const sorted = [...rawList].sort((a, b) => 
        currentMode === 'up' ? b.change1h - a.change1h : a.change1h - b.change1h
      );

      const top20 = sorted.slice(0, 20);
      const listEl = document.getElementById('crypto-list');
      listEl.innerHTML = '';

      top20.forEach((coin, index) => {
        const symbolClean = coin.symbol.replace('USDT', '');
        const change = coin.change1h.toFixed(2);
        const isUp = coin.change1h >= 0;
        const price = parseFloat(coin.lastPrice).toLocaleString();

        listEl.innerHTML += `
          <div class="card" onclick="toggleCard('${coin.symbol}')">
            <div class="card-header">
              <span class="rank">${index + 1}</span>
              <div class="coin-info">
                <div>
                  <div class="symbol">${symbolClean} <span style="font-size:12px;color:#64748b;">/USDT</span></div>
                  <div class="price">$${price}</div>
                </div>
              </div>
              <div class="change ${isUp ? 'up' : 'down'}">
                ${isUp ? '+' : ''}${change}%
              </div>
            </div>
            
            <div class="chart-box" id="box-${coin.symbol}">
              <div class="timeframe-btns" onclick="event.stopPropagation()">
                <button class="tf-btn active" onclick="loadKLine('${coin.symbol}', '15m', this)">15M</button>
                <button class="tf-btn" onclick="loadKLine('${coin.symbol}', '1h', this)">1H</button>
                <button class="tf-btn" onclick="loadKLine('${coin.symbol}', '4h', this)">4H</button>
                <button class="tf-btn" onclick="loadKLine('${coin.symbol}', '1d', this)">1D</button>
              </div>
              <div class="kline-container" id="kline-${coin.symbol}"></div>
            </div>
          </div>
        `;
      });
    }

    function toggleCard(symbol) {
      const box = document.getElementById(`box-${symbol}`);
      const isHidden = box.style.display === '' || box.style.display === 'none';
      
      document.querySelectorAll('.chart-box').forEach(el => el.style.display = 'none');

      if (isHidden) {
        box.style.display = 'block';
        const defaultBtn = box.querySelector('.tf-btn');
        // 給予容器 50ms 展開渲染時間後再繪製圖表
        setTimeout(() => {
          loadKLine(symbol, '15m', defaultBtn);
        }, 50);
      }
    }

    async function loadKLine(symbol, interval, btnEl) {
      if(btnEl) {
        const parent = btnEl.parentElement;
        parent.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
        btnEl.classList.add('active');
      }

      const container = document.getElementById(`kline-${symbol}`);
      container.innerHTML = '';

      // 取得實際渲染高度與寬度
      const chartWidth = container.clientWidth || 300;
      const chartHeight = 180;

      const chart = LightweightCharts.createChart(container, {
        width: chartWidth,
        height: chartHeight,
        layout: { background: { color: 'transparent' }, textColor: '#94a3b8' },
        grid: { vertLines: { color: '#334155' }, horzLines: { color: '#334155' } },
        timeScale: { timeVisible: true, secondsVisible: false }
      });

      const candleSeries = chart.addCandlestickSeries({
        upColor: '#22c55e',
        downColor: '#ef4444',
        borderVisible: false,
        wickUpColor: '#22c55e',
        wickDownColor: '#ef4444',
      });

      const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=40`);
      const kData = await res.json();
      
      const formattedCandles = kData.map(k => ({
        time: Math.floor(k[0] / 1000), // 確保 Unix 時間戳格式正確
        open: parseFloat(k[1]),
        high: parseFloat(k[2]),
        low: parseFloat(k[3]),
        close: parseFloat(k[4]),
      }));

      candleSeries.setData(formattedCandles);
      chart.timeScale().fitContent();
    }

    fetchBinanceData();
    setInterval(fetchBinanceData, 60000);
  </script>
