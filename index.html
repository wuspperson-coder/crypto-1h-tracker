  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBvvJrZqe-Zs5G83j7LsQISacIzLLJjxRU",
      authDomain: "my-crypto-radar.firebaseapp.com",
      databaseURL: "https://my-crypto-radar-default-rtdb.firebaseio.com",
      projectId: "my-crypto-radar",
      storageBucket: "my-crypto-radar.firebasestorage.app",
      messagingSenderId: "855010216604",
      appId: "1:855010216604:web:a7976f9c0ffa7f3149bb59",
      measurementId: "G-NW4QL1CW6L"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const tradesRef = db.ref('paper_trades');

    let currentTimeframe = '1h';
    let currentPage = 'dashboard';
    let boardMode = 'bull';
    let paperTrades = [];

    let cachedBullList = [];
    let cachedBearList = [];

    tradesRef.on('value', (snapshot) => {
      const data = snapshot.val();
      paperTrades = data ? Object.values(data) : [];
      if (currentPage === 'paper') renderPaperTrades();
    });

    function switchPage(page) {
      currentPage = page;
      document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
      document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));

      if (page === 'dashboard') {
        document.getElementById('menu-dashboard').classList.add('active');
        document.getElementById('page-dashboard').classList.add('active');
        document.getElementById('page-title').innerText = '💛 幣安加密貨幣多空強勢榜';
        document.getElementById('tf-group').style.display = 'flex';
        fetchData();
      } else if (page === 'pump') {
        document.getElementById('menu-pump').classList.add('active');
        document.getElementById('page-pump').classList.add('active');
        document.getElementById('page-title').innerText = '🚀 爆量動能篩選器 (1H/4H)';
        document.getElementById('tf-group').style.display = 'none';
        fetchData();
      } else if (page === 'paper') {
        document.getElementById('menu-paper').classList.add('active');
        document.getElementById('page-paper').classList.add('active');
        document.getElementById('page-title').innerText = '🤖 全自動動能突破策略引擎 (EMA 20/50/100/200)';
        document.getElementById('tf-group').style.display = 'none';
        renderPaperTrades();
      }
    }

    function changeTimeframe(tf) {
      currentTimeframe = tf;
      document.querySelectorAll('.timeframe-group .tf-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${tf}`).classList.add('active');
      fetchData();
    }

    function switchBoardMode(mode) {
      boardMode = mode;
      document.getElementById('btn-show-bull').className = mode === 'bull' ? 'board-toggle-btn active-bull' : 'board-toggle-btn';
      document.getElementById('btn-show-bear').className = mode === 'bear' ? 'board-toggle-btn active-bear' : 'board-toggle-btn';
      renderList('dashboard-single-list', mode === 'bull' ? cachedBullList : cachedBearList);
    }

    function calcEMA(prices, period) {
      if (prices.length < period) return prices[prices.length - 1];
      const k = 2 / (period + 1);
      let ema = prices.slice(0, period).reduce((a, b) => a + b, 0) / period;
      for (let i = period; i < prices.length; i++) ema = prices[i] * k + ema * (1 - k);
      return ema;
    }

    function calcATR(klines, period = 14) {
      let trs = [];
      for (let i = 1; i < klines.length; i++) {
        const h = parseFloat(klines[i][2]), l = parseFloat(klines[i][3]), pc = parseFloat(klines[i-1][4]);
        trs.push(Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc)));
      }
      return trs.slice(-period).reduce((a, b) => a + b, 0) / period;
    }

    /* 🚦 更正一：BTC 大盤紅綠燈採用 EMA 20/50/100/200 排列 */
    async function fetchBTCSignals() {
      try {
        const tfs = [{tf:'15m',id:'btc-light-15m'}, {tf:'1h',id:'btc-light-1h'}, {tf:'4h',id:'btc-light-4h'}, {tf:'1d',id:'btc-light-1d'}];
        for (let item of tfs) {
          const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${item.tf}&limit=210`);
          const klines = await res.json();
          const closes = klines.map(k => parseFloat(k[4]));
          const price = closes[closes.length - 1];
          if (item.tf === '1h') document.getElementById('btc-price').innerText = `$${price.toLocaleString()}`;

          const ema20 = calcEMA(closes, 20);
          const ema50 = calcEMA(closes, 50);
          const ema100 = calcEMA(closes, 100);
          const ema200 = calcEMA(closes, 200);

          const isBull = price > ema20 && ema20 > ema50 && ema50 > ema100 && ema100 > ema200;
          document.getElementById(item.id).className = isBull ? 'light-dot dot-green' : 'light-dot dot-red';
        }
      } catch(e){}
    }

    /* 🤖 更正二/三/四：小區塊訊號判斷、連續 K 棒實體低點 SL、單向上升 ATR 移動止損 */
    async function runAutoEngine() {
      fetchBTCSignals();
      try {
        const res = await fetch('https://api.binance.com/api/v3/ticker/24hr');
        const data = await res.json();
        let usdtPairs = data.filter(d => d.symbol.endsWith('USDT') && !d.symbol.includes('UP') && !d.symbol.includes('DOWN'))
                            .sort((a,b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume)).slice(0, 50);

        for (let coin of usdtPairs) {
          const kRes = await fetch(`https://api.binance.com/api/v3/klines?symbol=${coin.symbol}&interval=1h&limit=210`);
          const klines = await kRes.json();
          const closes = klines.map(k => parseFloat(k[4]));
          const price = closes[closes.length - 1];

          // 1. EMA 20/50/100/200 多頭排列檢查
          const ema20 = calcEMA(closes, 20);
          const ema50 = calcEMA(closes, 50);
          const ema100 = calcEMA(closes, 100);
          const ema200 = calcEMA(closes, 200);
          const isEmaBull = price > ema20 && ema20 > ema50 && ema50 > ema100 && ema100 > ema200;

          // 2. 檢測爆量 K 棒與 OI 資金流入
          const lastK = klines[klines.length - 2];
          const vol = parseFloat(lastK[5]);
          const avgVol = klines.slice(-20).reduce((acc, k) => acc + parseFloat(k[5]), 0) / 20;
          const isVolumeSpike = vol >= avgVol * 1.5;

          let isOiRise = false;
          try {
            const oiRes = await fetch(`https://fapi.binance.com/futures/data/openInterestHist?symbol=${coin.symbol}&period=1h&limit=3`);
            const oiData = await oiRes.json();
            if (Array.isArray(oiData) && oiData.length >= 2) {
              const curOI = parseFloat(oiData[oiData.length - 1].sumOpenInterestValue);
              const prevOI = parseFloat(oiData[oiData.length - 2].sumOpenInterestValue);
              if (((curOI - prevOI) / prevOI) >= 0.01) isOiRise = true;
            }
          } catch(e){}

          // 三重訊號確認 (EMA + Volume + OI)
          if (isEmaBull && isVolumeSpike && isOiRise) {
            checkAndCreateLimitOrder(coin.symbol, klines);
          }
        }

        processTradesExecution(usdtPairs);
        document.getElementById('time').innerText = '最後掃描：' + new Date().toLocaleTimeString();
      } catch(e){ console.error(e); }
    }

    // 計算「連續 K 棒」總實體區間 50% 掛單價與實體最低點 SL
    function checkAndCreateLimitOrder(symbol, klines) {
      const hasExist = paperTrades.some(t => t.symbol === symbol && (t.status === 'PENDING' || t.status === 'OPEN'));
      if (hasExist) return;

      // 向上回溯計算「連續陽線/拉升 K 棒群」（最多回溯近 5 根）
      let seriesK = [];
      for (let i = klines.length - 2; i >= Math.max(0, klines.length - 6); i--) {
        const openP = parseFloat(klines[i][1]);
        const closeP = parseFloat(klines[i][4]);
        if (closeP >= openP) {
          seriesK.push(klines[i]);
        } else {
          break; // 遇到陰線終止連續 K 棒計算
        }
      }
      if (seriesK.length === 0) seriesK.push(klines[klines.length - 2]);

      // 計算整段連續 K 棒的實體最高點與實體最低點
      let maxBodyHigh = -Infinity;
      let minBodyLow = Infinity;

      seriesK.forEach(k => {
        const o = parseFloat(k[1]), c = parseFloat(k[4]);
        const bodyHigh = Math.max(o, c);
        const bodyLow = Math.min(o, c);
        if (bodyHigh > maxBodyHigh) maxBodyHigh = bodyHigh;
        if (bodyLow < minBodyLow) minBodyLow = bodyLow;
      });

      const limitEntryPrice = (maxBodyHigh + minBodyLow) / 2; // 連續 K 棒總實體 50% 掛單價
      const slPrice = minBodyLow; // 連續 K 棒實體最低點作為硬止損
      const riskDistance = limitEntryPrice - slPrice;

      if (riskDistance <= 0) return;

      const tp1Price = limitEntryPrice + (riskDistance * 2.0); // 2x SL 止盈賣 50%
      const currentAtr = calcATR(klines, 14);
      const tradeId = 'trade_' + Date.now() + '_' + Math.floor(Math.random()*1000);

      const newTrade = {
        id: tradeId,
        symbol,
        entryPrice: limitEntryPrice,
        slPrice,
        tp1Price,
        atr: currentAtr,
        trailStopPrice: slPrice, // 初始移動止損點 = SL
        highestPrice: limitEntryPrice, // 記錄成交後的最高價
        isHalfClosed: false,
        status: 'PENDING',
        createdTime: new Date().toLocaleTimeString(),
        executedTime: null,
        pnlPct: 0
      };

      tradesRef.child(tradeId).set(newTrade);
    }

    // 撮合成交與單向上升 ATR 移動止損管理
    function processTradesExecution(marketTickers) {
      paperTrades.forEach(t => {
        const coin = marketTickers.find(c => c.symbol === t.symbol);
        if (!coin) return;

        const currentP = parseFloat(coin.lastPrice);

        if (t.status === 'PENDING') {
          // 回踩碰觸 50% 掛單價時真正成交
          if (currentP <= t.entryPrice) {
            t.status = 'OPEN';
            t.executedTime = new Date().toLocaleTimeString();
            t.highestPrice = t.entryPrice;
            tradesRef.child(t.id).update(t);
          }
        } 
        else if (t.status === 'OPEN') {
          let needsUpdate = false;

          // 更新持倉後的最高價
          if (currentP > t.highestPrice) {
            t.highestPrice = currentP;
            needsUpdate = true;
          }

          // 更正四：TP2 移動止損根據 ATR 單向向上抬升（絕不下降）
          if (t.isHalfClosed) {
            const newTrailStop = t.highestPrice - (t.atr * 1.5);
            if (newTrailStop > t.trailStopPrice) { // 只能單向調高！
              t.trailStopPrice = newTrailStop;
              needsUpdate = true;
            }
          }

          // 觸發 TP1 (2x SL) 賣出 50% 倉位並開啟保本
          if (!t.isHalfClosed && currentP >= t.tp1Price) {
            t.isHalfClosed = true;
            t.trailStopPrice = Math.max(t.trailStopPrice, t.entryPrice); // 止損抬升至進場價保本
            t.pnlPct += 2.0;
            needsUpdate = true;
          }

          // 價格向下擊穿移動止損點/保本點平倉離場
          if (currentP <= t.trailStopPrice) {
            t.status = t.isHalfClosed ? 'WIN' : 'LOSS';
            t.pnlPct = t.isHalfClosed ? 1.0 : -1.0;
            needsUpdate = true;
          }

          if (needsUpdate) {
            tradesRef.child(t.id).update(t);
          }
        }
      });
    }

    function fetchData() {
      fetchBTCSignals();
      try {
        fetch('https://api.binance.com/api/v3/ticker/24hr')
          .then(res => res.json())
          .then(async data => {
            let usdtPairs = data.filter(d => d.symbol.endsWith('USDT') && !d.symbol.includes('UP') && !d.symbol.includes('DOWN'))
                                .sort((a,b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume)).slice(0, 50);

            const processed = await Promise.all(usdtPairs.map(async (coin) => {
              try {
                const kRes = await fetch(`https://api.binance.com/api/v3/klines?symbol=${coin.symbol}&interval=1h&limit=60`);
                const klines = await kRes.json();
                const currentPrice = parseFloat(coin.lastPrice);
                const p1h = parseFloat(klines[klines.length - 2][4]);
                const p4h = parseFloat(klines[Math.max(0, klines.length - 5)][4]);

                return {
                  symbol: coin.symbol.replace('USDT', ''),
                  fullSymbol: coin.symbol,
                  price: currentPrice,
                  change1h: ((currentPrice - p1h) / p1h) * 100,
                  change4h: ((currentPrice - p4h) / p4h) * 100,
                  change1d: parseFloat(coin.priceChangePercent)
                };
              } catch(e){ return null; }
            }));

            const validData = processed.filter(d => d !== null);

            if (currentPage === 'dashboard') {
              cachedBullList = [...validData].sort((a, b) => b[`change${currentTimeframe}`] - a[`change${currentTimeframe}`]).slice(0, 15);
              cachedBearList = [...validData].sort((a, b) => a[`change${currentTimeframe}`] - b[`change${currentTimeframe}`]).slice(0, 15);
              renderList('dashboard-single-list', boardMode === 'bull' ? cachedBullList : cachedBearList);
            }

            document.getElementById('time').innerText = '最後更新：' + new Date().toLocaleTimeString();
          });
      } catch(e){ console.error(e); }
    }

    function renderList(containerId, list) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      list.forEach((coin, index) => {
        const change = coin[`change${currentTimeframe}`].toFixed(2);
        const isUp = change >= 0;

        container.innerHTML += `
          <div class="card">
            <div class="card-header" onclick="toggleCharts('${coin.fullSymbol}', '${containerId}')">
              <div>
                <div class="symbol">${index + 1}. ${coin.symbol} <span style="font-size:12px;color:#848e9c;">/USDT</span></div>
                <div style="font-size:13px;color:#848e9c;margin-top:2px;">$${coin.price.toLocaleString()}</div>
              </div>
              <div class="change ${isUp ? 'up' : 'down'}">
                ${isUp ? '+' : ''}${change}%
              </div>
            </div>
            <div class="charts-wrapper" id="wrapper-${containerId}-${coin.fullSymbol}">
              <div class="tv-chart-container" id="tv-box-${containerId}-${coin.fullSymbol}"></div>
            </div>
          </div>
        `;
      });
    }

    function toggleCharts(symbol, containerId) {
      const wrapper = document.getElementById(`wrapper-${containerId}-${symbol}`);
      if (wrapper.style.display === 'block') { wrapper.style.display = 'none'; return; }
      wrapper.style.display = 'block';

      const container = document.getElementById(`tv-box-${containerId}-${symbol}`);
      container.innerHTML = '';
      setTimeout(() => {
        new TradingView.widget({
          "autosize": true, "symbol": `BINANCE:${symbol}`, "interval": "60",
          "timezone": "Asia/Taipei", "theme": "dark", "style": "1", "container_id": `tv-box-${containerId}-${symbol}`
        });
      }, 50);
    }

    function renderPaperTrades() {
      const container = document.getElementById('paper-trades-list');
      container.innerHTML = '';

      let closed = paperTrades.filter(t => t.status === 'WIN' || t.status === 'LOSS');
      let wins = paperTrades.filter(t => t.status === 'WIN').length;
      let winrate = closed.length > 0 ? ((wins/closed.length)*100).toFixed(1) : 0;
      let totalPnl = paperTrades.reduce((acc, curr) => acc + curr.pnlPct, 0).toFixed(1);

      document.getElementById('stat-total').innerText = paperTrades.filter(t => t.status !== 'PENDING').length;
      document.getElementById('stat-winrate').innerText = winrate + '%';
      document.getElementById('stat-pnl').innerText = (totalPnl >= 0 ? '+' : '') + totalPnl + ' R';

      if (paperTrades.length === 0) {
        container.innerHTML = `<div style="text-align:center;padding:40px;color:#848e9c;background:#1e2329;border-radius:12px;">目前無監控中或掛單中的標的...</div>`;
        return;
      }

      paperTrades.forEach(t => {
        let badge = '<span class="badge badge-pending">⏳ 連續K棒 50% 掛單中 (等待回踩)</span>';
        if (t.status === 'OPEN' && !t.isHalfClosed) badge = '<span class="badge" style="background:#38bdf8;color:#000;">🟢 已回踩進場 (持倉中)</span>';
        if (t.isHalfClosed && t.status === 'OPEN') badge = '<span class="badge badge-pump">✅ 觸發 2x SL 賣50% (ATR 移動止損抬升中)</span>';
        if (t.status === 'WIN') badge = '<span class="badge badge-pump">🎯 獲利結算 WIN</span>';
        if (t.status === 'LOSS') badge = '<span class="badge" style="background:#ef4444;color:#fff;">🚨 觸發止損 LOSS</span>';

        container.innerHTML += `
          <div class="card">
            <div class="card-header" onclick="toggleTradeCharts('${t.id}', '${t.symbol}')">
              <div>
                <div class="symbol">${t.symbol}</div>
                <div class="badges">${badge} <span style="font-size:10px;color:#848e9c;">掛單時間: ${t.createdTime} ${t.executedTime ? '| 成交: '+t.executedTime : ''}</span></div>
              </div>
              <div style="font-weight:bold;font-size:16px;color:${t.pnlPct >= 0 ? '#22c55e':'#ef4444'};">
                ${t.pnlPct >= 0 ? '+':''}${t.pnlPct.toFixed(1)} R
              </div>
            </div>

            <div class="charts-wrapper" id="trade-wrapper-${t.id}">
              <div class="position-box-panel">
                <div class="position-item pos-entry"><div class="pos-label">🟡 連續K棒50%掛單價</div><div class="pos-val" style="color:#facc15;">$${t.entryPrice.toFixed(4)}</div></div>
                <div class="position-item pos-sl"><div class="pos-label">🔴 實體最低點 SL</div><div class="pos-val" style="color:#ef4444;">$${t.slPrice.toFixed(4)}</div></div>
                <div class="position-item pos-tp"><div class="pos-label">🟢 1TP (2x SL 賣50%)</div><div class="pos-val" style="color:#22c55e;">$${t.tp1Price.toFixed(4)}</div></div>
                <div class="position-item pos-trail"><div class="pos-label">🛡️ 單向上升 ATR 止損</div><div class="pos-val" style="color:#38bdf8;">$${t.trailStopPrice.toFixed(4)}</div></div>
              </div>
              <div class="tv-chart-container" id="tv-box-${t.id}"></div>
            </div>
          </div>
        `;
      });
    }

    function toggleTradeCharts(tradeId, symbol) {
      const wrapper = document.getElementById(`trade-wrapper-${tradeId}`);
      if (wrapper.style.display === 'block') { wrapper.style.display = 'none'; return; }
      wrapper.style.display = 'block';

      const container = document.getElementById(`tv-box-${tradeId}`);
      container.innerHTML = '';
      setTimeout(() => {
        new TradingView.widget({
          "autosize": true, "symbol": `BINANCE:${symbol}`, "interval": "60",
          "timezone": "Asia/Taipei", "theme": "dark", "style": "1", "container_id": `tv-box-${tradeId}`
        });
      }, 50);
    }

    function exportTradesCSV() {
      let csvContent = "data:text/csv;charset=utf-8,\uFEFFID,代幣,50%掛單價,實體最低點止損價,2xSL止盈價,狀態,盈虧R值,掛單時間\n";
      paperTrades.forEach(t => {
        csvContent += `${t.id},${t.symbol},${t.entryPrice},${t.slPrice},${t.tp1Price},${t.status},${t.pnlPct},${t.createdTime}\n`;
      });
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `LimitOrder_Trades_Report_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    function clearPaperTrades() {
      if (confirm('確定要清空 Firebase 雲端上的所有模擬交易紀錄嗎？')) {
        tradesRef.remove();
      }
    }

    runAutoEngine();
    setInterval(runAutoEngine, 120000);
  </script>
</body>
</html>
