<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>幣安動態漲跌幅榜</title>
  <!-- 引入 Chart.js 及 縮放插件 (Zoom Plugin) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0b0e14; color: #eaecef; margin: 0; padding: 15px; }
    
    /* 密碼鎖遮罩 */
    #lock-screen { position: fixed; top:0; left:0; width:100%; height:100%; background:#0b0e14; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:9999; }
    #lock-screen input { padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #363c4e; background: #1e2329; color: #fff; text-align: center; margin-bottom: 12px; width: 220px; }
    #lock-screen button { padding: 10px 24px; font-size: 16px; font-weight: bold; background: #f0b90b; border: none; border-radius: 8px; cursor: pointer; color: #000; }
    
    .container { max-width: 600px; margin: 0 auto; display: none; }
    h1 { text-align: center; color: #f0b90b; font-size: 20px; margin-bottom: 4px; }
    .update-time { text-align: center; color: #848e9c; font-size: 12px; margin-bottom: 15px; }
    
    /* 漲/跌榜切換列 */
    .tab-group { display: flex; gap: 8px; margin-bottom: 10px; }
    .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; background: #1e2329; color: #848e9c; font-weight: bold; cursor: pointer; font-size: 15px; }
    .tab-btn.active-gainers { background: #22c55e; color: #fff; }
    .tab-btn.active-losers { background: #ef4444; color: #fff; }

    /* 時間週期選擇列 */
    .btn-group { display: flex; gap: 8px; margin-bottom: 15px; }
    .btn { flex: 1; padding: 8px; border: 1px solid #2b313a; border-radius: 6px; background: #141821; color: #848e9c; font-weight: bold; cursor: pointer; text-align: center; font-size: 13px; }
    .btn.active { background: #f0b90b; color: #000; border-color: #f0b90b; }
    
    /* 幣種卡片 */
    .card { background: #1e2329; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid #2b313a; }
    .card-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .symbol { font-size: 16px; font-weight: bold; }
    .price { color: #848e9c; font-size: 13px; margin-top: 2px; }
    .badges { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
    .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .badge-pump { background: rgba(14, 203, 129, 0.2); color: #0ecb81; border: 1px solid #0ecb81; }
    .badge-dump { background: rgba(246, 70, 93, 0.2); color: #f6465d; border: 1px solid #f6465d; }
    
    .change { font-weight: bold; padding: 8px 12px; border-radius: 6px; font-size: 15px; }
    .up { background: rgba(14, 203, 129, 0.15); color: #0ecb81; }
    .down { background: rgba(246, 70, 93, 0.15); color: #f6465d; }
    
    /* 圖表容器（修改版：預設正確尺寸） */
    .chart-container { margin-top: 12px; height: 260px; position: relative; display: none; background: #141821; border-radius: 8px; padding: 8px; }
    .chart-tips { font-size: 10px; color: #848e9c; text-align: right; margin-top: 4px; }
  </style>
</head>
<body>

  <!-- 密碼鎖畫面 -->
  <div id="lock-screen">
    <h2 style="color:#f0b90b; margin-bottom:15px;">🔒 請輸入解鎖密碼</h2>
    <input type="password" id="password-input" placeholder="請輸入密碼">
    <button onclick="checkPassword()">解鎖網站</button>
  </div>

  <!-- 主網站內容 -->
  <div class="container" id="main-content">
    <h1>💛 幣安加密貨幣動態榜</h1>
    <div class="update-time" id="time">載入中...</div>
    
    <!-- 漲幅榜 / 跌幅榜 切換 -->
    <div class="tab-group">
      <button class="tab-btn active-gainers" id="tab-gainers" onclick="changeMode('gainers')">🚀 漲幅榜</button>
      <button class="tab-btn" id="tab-losers" onclick="changeMode('losers')">📉 跌幅榜</button>
    </div>

    <!-- 時間週期選擇 -->
    <div class="btn-group">
      <button class="btn active" id="btn-1h" onclick="changeTimeframe('1h')">1HR</button>
      <button class="btn" id="btn-4h" onclick="changeTimeframe('4h')">4HR</button>
      <button class="btn" id="btn-1d" onclick="changeTimeframe('1d')">1D</button>
    </div>

    <div id="crypto-list">獲取數據中...</div>
  </div>

  <script>
    const CORRECT_PASS = "20050908";
    let currentTimeframe = '1h';
    let currentMode = 'gainers'; // 'gainers' 或 'losers'
    let chartInstances = {};

    function checkPassword() {
      const input = document.getElementById('password-input').value;
      if (input === CORRECT_PASS) {
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
        fetchData();
      } else {
        alert('密碼錯誤！');
      }
    }

    function changeMode(mode) {
      currentMode = mode;
      document.getElementById('tab-gainers').className = `tab-btn ${mode === 'gainers' ? 'active-gainers' : ''}`;
      document.getElementById('tab-losers').className = `tab-btn ${mode === 'losers' ? 'active-losers' : ''}`;
      fetchData();
    }

    function changeTimeframe(tf) {
      currentTimeframe = tf;
      document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${tf}`).classList.add('active');
      fetchData();
    }

    async function fetchData() {
      try {
        const res = await fetch('https://api.binance.com/api/v3/ticker/24hr');
        const data = await res.json();
        
        let usdtPairs = data.filter(d => d.symbol.endsWith('USDT') && !d.symbol.includes('UP') && !d.symbol.includes('DOWN'));
        usdtPairs = usdtPairs.sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume)).slice(0, 100);

        const processed = await Promise.all(usdtPairs.map(async (coin) => {
          try {
            const kRes = await fetch(`https://api.binance.com/api/v3/klines?symbol=${coin.symbol}&interval=15m&limit=30`);
            const klines = await kRes.json();
            
            const currentPrice = parseFloat(coin.lastPrice);
            const p15m = parseFloat(klines[klines.length - 2][4]);
            const p1h = parseFloat(klines[Math.max(0, klines.length - 5)][4]);
            const p4h = parseFloat(klines[Math.max(0, klines.length - 17)][4]);
            
            return {
              symbol: coin.symbol.replace('USDT', ''),
              fullSymbol: coin.symbol,
              price: currentPrice,
              change15m: ((currentPrice - p15m) / p15m) * 100,
              change1h: ((currentPrice - p1h) / p1h) * 100,
              change4h: ((currentPrice - p4h) / p4h) * 100,
              change1d: parseFloat(coin.priceChangePercent)
            };
          } catch(e) { return null; }
        }));

        const validData = processed.filter(d => d !== null);
        
        // 根據漲幅/跌幅模式進行排序
        if (currentMode === 'gainers') {
          validData.sort((a, b) => b[`change${currentTimeframe}`] - a[`change${currentTimeframe}`]);
        } else {
          validData.sort((a, b) => a[`change${currentTimeframe}`] - b[`change${currentTimeframe}`]);
        }

        renderList(validData.slice(0, 20));
        document.getElementById('time').innerText = '最後更新：' + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById('crypto-list').innerText = '數據載入失敗，請稍後重試。';
      }
    }

    function renderList(list) {
      const listEl = document.getElementById('crypto-list');
      listEl.innerHTML = '';
      
      // 清空舊的 chart 實例記錄
      chartInstances = {};

      list.forEach((coin, index) => {
        const change = coin[`change${currentTimeframe}`].toFixed(2);
        const isUp = change >= 0;
        
        let badgeHtml = '';
        if (coin.change15m >= 2.0) badgeHtml = `<span class="badge badge-pump">⚡ 15M急漲 +${coin.change15m.toFixed(1)}%</span>`;
        if (coin.change15m <= -2.0) badgeHtml = `<span class="badge badge-dump">🚨 15M急跌 ${coin.change15m.toFixed(1)}%</span>`;

        listEl.innerHTML += `
          <div class="card">
            <div class="card-header" onclick="toggleChart('${coin.fullSymbol}')">
              <div>
                <div class="symbol">${index + 1}. ${coin.symbol} <span style="font-size:12px;color:#848e9c;">/USDT</span></div>
                <div class="price">$${coin.price.toLocaleString()}</div>
                <div class="badges">${badgeHtml}</div>
              </div>
              <div class="change ${isUp ? 'up' : 'down'}">
                ${isUp ? '+' : ''}${change}%
              </div>
            </div>
            <div class="chart-container" id="chart-box-${coin.fullSymbol}">
              <canvas id="chart-${coin.fullSymbol}"></canvas>
              <div class="chart-tips">💡 雙指或滾輪可放大/縮小，拖曳可平移圖表</div>
            </div>
          </div>
        `;
      });
    }

    function toggleChart(symbol) {
      const box = document.getElementById(`chart-box-${symbol}`);
      const isVisible = box.style.display === 'block';

      if (isVisible) {
        box.style.display = 'none';
      } else {
        box.style.display = 'block';
        
        // 如果圖表已存在，強制更新大小並繪製；否則重新創建
        if (chartInstances[symbol]) {
          setTimeout(() => chartInstances[symbol].resize(), 50);
        } else {
          fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=15m&limit=40`)
            .then(res => res.json())
            .then(klines => {
              const labels = klines.map(k => new Date(k[0]).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}));
              const prices = klines.map(k => parseFloat(k[4]));

              const ctx = document.getElementById(`chart-${symbol}`).getContext('2d');
              chartInstances[symbol] = new Chart(ctx, {
                type: 'line',
                data: {
                  labels: labels,
                  datasets: [{
                    label: '價格 (USDT)',
                    data: prices,
                    borderColor: '#f0b90b',
                    backgroundColor: 'rgba(240, 185, 11, 0.1)',
                    fill: true,
                    tension: 0.2
                  }]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: {
                    legend: { display: false },
                    zoom: {
                      pan: { enabled: true, mode: 'xy' },
                      zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'xy' }
                    }
                  },
                  scales: {
                    x: { ticks: { color: '#848e9c', font: { size: 10 } } },
                    y: { ticks: { color: '#848e9c', font: { size: 10 } } }
                  }
                }
              });
            });
        }
      }
    }

    setInterval(fetchData, 120000);
  </script>
</body>
</html>
